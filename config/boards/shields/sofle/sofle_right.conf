# Right-hand Azoteq TPS43/TPS65 touchpad.
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y
CONFIG_SSD1306=n

# Keep the split peripheral powered so it can remain connected to the left half.
CONFIG_ZMK_SLEEP=n

# Diagnostic build: USB logs, without per-frame input debug output.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_INPUT_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=4096
