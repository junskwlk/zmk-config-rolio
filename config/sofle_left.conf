CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_POINTING=y

# Loaded per-half config: improve BLE range between the E73 halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_6=y

# Studio must be enabled in this loaded per-half config.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Three-finger Mission Control reaches 1192 bytes in the input thread.
# The former 512-byte default overflowed and halted the central half.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
