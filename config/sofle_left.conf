CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n
CONFIG_ZMK_POINTING=y

# Loaded per-half config: improve BLE range between the E73 halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_6=y

# Studio must be enabled in this loaded per-half config.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Diagnostic only: keep v10 gesture behavior unchanged.
# USB CDC is reserved for logs while reproducing the central-side halt.
CONFIG_ZMK_STUDIO_TRANSPORT_UART=n
CONFIG_THREAD_NAME=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_INIT_STACKS=y
CONFIG_FAULT_DUMP=2
# Diagnostic v3: increase only input capacity versus v2; measure peak usage.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Keep logs bounded and observe thread stack usage without increasing input stack.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
